# asq in a container: the page, the API and the MCP endpoint over the session stores of
# the host, mounted read-only.
#
#   ASQ_TOKEN=$(openssl rand -hex 24) docker compose up -d
#
# This builds the image from the source beside this file, so it is always the asq of
# this checkout. To run a published image instead — every release pushes one, for
# linux/amd64 and linux/arm64 — replace the build block with
#   image: ghcr.io/itswl/agent-session-query:<version>
services:
  asq:
    build:
      context: .
      # args:
      #   GO_IMAGE: <mirror>/golang:1.26-alpine
      #   GOPROXY: https://goproxy.cn,direct
    container_name: asq
    ports:
      # Published on the host's loopback only: what this serves is every prompt typed
      # and every file an agent printed. To share it, publish "7717:7717" — the token
      # is then all that stands in front of it, so put TLS in front as well.
      - "127.0.0.1:7717:7717"
    environment:
      # Required: a container listens on all of its interfaces, and asq refuses to do
      # that without a token. It travels in the environment rather than on the command
      # line, which a process listing shows. The page signs in with the same token.
      ASQ_TOKEN: "${ASQ_TOKEN:?set ASQ_TOKEN, e.g. ASQ_TOKEN=$(openssl rand -hex 24)}"
      # The zone a report's days are counted in; the binary carries the zone database
      TZ: "${TZ:-UTC}"
      # Read only some of the stores: ASQ_ONLY: "claude,codex"
    volumes:
      # The index: a cache of the stores below, kept so a restart reads only what changed
      - asq-index:/data
      # Mount the stores the host has; one with nothing mounted is skipped. HOME is
      # /root inside, so each mounts where its CLI keeps it under the home directory.
      # A directory missing on the host is created by Docker, empty and owned by root:
      # delete the lines for the CLIs you do not use.
      - ~/.claude/projects:/root/.claude/projects:ro
      # Only the sessions of each CLI, never its whole directory: beside them sit the
      # CLI's credentials, which this has no business being able to read.
      - ~/.codex/sessions:/root/.codex/sessions:ro
      - ~/.codex/archived_sessions:/root/.codex/archived_sessions:ro
      - ~/.gemini/tmp:/root/.gemini/tmp:ro
      # Antigravity: the agy CLI and the IDE each keep a brain of their own
      - ~/.gemini/antigravity-cli:/root/.gemini/antigravity-cli:ro
      - ~/.gemini/antigravity:/root/.gemini/antigravity:ro
      - ~/.local/share/opencode:/root/.local/share/opencode:ro
      - ~/.grok/sessions:/root/.grok/sessions:ro
      - ~/.grok/archived_sessions:/root/.grok/archived_sessions:ro
      - ~/.pi/agent/sessions:/root/.pi/agent/sessions:ro
      - ~/.dsh/sessions:/root/.dsh/sessions:ro
      # Hermes is the exception: everything is in state.db with its -wal and -shm beside
      # it, so the whole directory has to come along — configuration and credentials
      # included. One more reason this stays read-only and off the network.
      - ~/.hermes:/root/.hermes:ro
      - ~/.openclaw/agents:/root/.openclaw/agents:ro
      - ~/.copilot/session-state:/root/.copilot/session-state:ro
      # A store somewhere else — another machine's home, a backup: mount it anywhere
      # and name it, and its sessions appear as "claude@box2".
      #   - /srv/box2/.claude/projects:/mnt/box2:ro
      # with, under environment:  ASQ_PATH: "claude@box2=/mnt/box2"
    # Runs as root on purpose: the mounted transcripts are 0600, and a fixed non-root
    # uid would read nothing. To run as yourself, name the ids (compose does not expand
    # $(id -u)) and make the index volume writable by them:
    #   user: "1000:1000"
    restart: unless-stopped

volumes:
  asq-index:
