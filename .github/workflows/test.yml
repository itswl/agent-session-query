# Runs on every push and PR: tests plus format / vet / cross-compile checks.
# release.yml only fires on a tag, so relying on it alone would surface problems on
# release day.
#
# Which platforms depends on where the push lands. A push to any other branch
# tests on Linux only; a pull request and a push to main test on all three. The
# macOS runner is billed at ten Linux minutes per minute and the Windows one at
# two, and this workflow ran the full matrix on 107 branch pushes in September
# 2026 — two thirds of the account's Actions bill, on a Free plan that includes
# 2,000 Linux minutes. The three-platform answer still arrives before anything
# merges, which is the moment it is read.
name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The race detector needs cgo and a C compiler. Both are ready on the Linux and macOS
      # runners; the Windows runner's toolchain is not always on PATH, so a plain test run
      # is enough there.
      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            CGO_ENABLED=0 go test ./...
          else
            go test -race ./...
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      # Cross-compile check: all six released platforms must build, including their
      # platform-specific files such as console_windows.go
      - name: Cross-compile check
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "  $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || exit 1
          done
