services:
  openclaw-session-query-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-session-query-api
    ports:
      - "8080:8080"
    volumes:
      # 挂载 OpenClaw 数据目录（可选）
      - ~/.openclaw/agents/default/sessions:/root/.openclaw/agents/default/sessions:ro
      # 挂载 Hermes 数据目录（可选）
      - ~/.hermes/sessions:/root/.hermes/sessions:ro
    environment:
      # 运行模式：auto（自动检测，存在的数据源都用）/ all / openclaw / hermes
      - MODE=${SESSION_MODE:-auto}
      # 认证令牌
      - HOOK_TOKEN=${HOOK_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      # 基础镜像（python:*-slim）里没有 curl，用 python 自己探活
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
