# Pushing a v* tag cross-compiles six platforms, publishes a container image built from
# the same binaries, and attaches everything to a GitHub Release. The only dependency
# is a pure-Go SQLite driver, so with cgo off cross-compilation needs no C toolchain.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Tests have to run on real machines: a cross-compiled test binary cannot execute on
  # another platform, and shipping a Windows artifact nothing ran on Windows is shipping
  # it blind.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Signing the macOS binaries (docs/development.md, "Signing for macOS"). The variable
      # names the certificate, and says signing is set up; a step's if: cannot read secrets,
      # a job's env can.
      MACOS_SIGNING_SHA1: ${{ vars.MACOS_SIGNING_SHA1 }}
      MACOS_SIGN: ${{ secrets.MACOS_SIGNING_KEY != '' && secrets.MACOS_SIGNING_CERT != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X github.com/itswl/agent-session-query/internal/app.Version=${GITHUB_REF_NAME}" -o "asq${{ matrix.ext }}" ./cmd/asq

      # macOS remembers whether asq may read a guarded folder (Documents, Desktop …) against
      # the binary's signature. Go's own is a hash of the one build, so every release was a
      # stranger to it and every macOS user was asked again; signed with one certificate
      # and one identifier, every release is the same program to it. Set up and missing its
      # key, a release would ask everyone again — twice, once more when the key is back.
      - name: Signing is set up
        if: matrix.goos == 'darwin' && env.MACOS_SIGNING_SHA1 != '' && env.MACOS_SIGN != 'true'
        run: |
          echo "::error::vars.MACOS_SIGNING_SHA1 is set, but the MACOS_SIGNING_KEY or MACOS_SIGNING_CERT secret is missing"
          exit 1

      # The variable alone switches signing on: secrets without it sign nothing
      - name: Sign for macOS
        if: matrix.goos == 'darwin' && env.MACOS_SIGNING_SHA1 != '' && env.MACOS_SIGN == 'true'
        env:
          KEY: ${{ secrets.MACOS_SIGNING_KEY }}
          CERT: ${{ secrets.MACOS_SIGNING_CERT }}
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          # rcodesign signs Mach-O binaries from Linux (indygreg/apple-platform-rs); pinned
          rc=apple-codesign-0.29.0-x86_64-unknown-linux-musl
          curl -fsSL -o "$dir/rc.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/$rc.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $dir/rc.tar.gz" | sha256sum -c -
          tar -xzf "$dir/rc.tar.gz" -C "$dir"
          printf '%s\n' "$KEY" > "$dir/key.pem"
          printf '%s\n' "$CERT" > "$dir/cert.pem"
          # The certificate the repository names, and no other
          have=$(openssl x509 -outform DER -in "$dir/cert.pem" | sha1sum | cut -c1-40)
          want=$(printf '%s' "$MACOS_SIGNING_SHA1" | tr 'A-F' 'a-f')
          if [ "$have" != "$want" ]; then
            echo "::error::the signing certificate is $have, not the $want vars.MACOS_SIGNING_SHA1 names"
            exit 1
          fi
          # No timestamp: macOS keys its answer on the certificate and the identifier, not on
          # when it was signed, and Apple's timestamp server down is no reason to hold a release
          "$dir/$rc/rcodesign" sign --timestamp-url none --pem-file "$dir/key.pem" --pem-file "$dir/cert.pem" --binary-identifier io.github.itswl.asq asq

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          binary="asq${{ matrix.ext }}"
          # Unpacking a tar.gz on Windows is awkward, so it gets a zip
          if [ "$GOOS" = windows ]; then
            zip -q "asq-$GOOS-$GOARCH.zip" "$binary"
          else
            tar czf "asq-$GOOS-$GOARCH.tar.gz" "$binary"
          fi
          # The container image is these same bytes, not a second compile: the linux
          # builds also hand over the bare binary for the image job to copy in
          if [ "$GOOS" = linux ]; then
            mkdir -p "image/$GOOS/$GOARCH"
            cp "$binary" "image/$GOOS/$GOARCH/asq"
          fi

      # Each job uploads its own archive and one job publishes them all. Publishing from
      # every build job is six of them racing to create one release, and creating a
      # release is not atomic: two jobs that both see none each make one.
      - uses: actions/upload-artifact@v7
        with:
          name: asq-${{ matrix.goos }}-${{ matrix.goarch }}
          path: asq-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

      # Named outside asq-*: the publish job downloads by that pattern and must not see these
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.goos }}-${{ matrix.goarch }}
          path: image/
          if-no-files-found: error

  verify-macos:
    # A release signed otherwise than the last one costs every macOS user a question: what
    # was signed is checked with Apple's own tools against the certificate the repository
    # names, before anything is published. Only once signing is set up.
    needs: build
    if: ${{ vars.MACOS_SIGNING_SHA1 != '' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: asq-darwin-*
          path: dist
          merge-multiple: true

      - name: Signature
        env:
          MACOS_SIGNING_SHA1: ${{ vars.MACOS_SIGNING_SHA1 }}
        run: |
          set -euo pipefail
          sha1=$(printf '%s' "$MACOS_SIGNING_SHA1" | tr 'A-F' 'a-f')
          want="designated => identifier \"io.github.itswl.asq\" and certificate root = H\"$sha1\""
          for arch in arm64 amd64; do
            mkdir -p "dist/$arch"
            tar -xzf "dist/asq-darwin-$arch.tar.gz" -C "dist/$arch"
            codesign -v --strict "dist/$arch/asq"
            have=$(codesign -d -r- "dist/$arch/asq" 2>&1 | grep -E '^(# )?designated => ' || true)
            if [ "$have" != "$want" ]; then
              echo "::error::darwin/$arch is signed as: ${have:-nothing}"
              exit 1
            fi
            # and it runs: the amd64 one where Rosetta is there to run it
            if [ "$arch" = arm64 ]; then
              "dist/$arch/asq" --version
            elif arch -x86_64 /usr/bin/true 2>/dev/null; then
              arch -x86_64 "dist/$arch/asq" --version
            fi
          done

  image:
    # The linux binaries the build matrix just produced, copied into an empty image by
    # Dockerfile.release: no compiler in this job, and byte-identical to the archives.
    # Pushed only when the release will be, so that latest never names a version without
    # one: after the macOS check, where it runs (skipped: signing not set up).
    needs: [build, verify-macos]
    if: ${{ !cancelled() && github.event.created && needs.build.result == 'success' && (needs.verify-macos.result == 'success' || needs.verify-macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The image's build provenance: a token from GitHub's OIDC to sign with, and the
      # attestations API to keep the statement in
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: image-linux-*
          path: dist-image
          merge-multiple: true

      # Multi-platform needs buildx; emulation is only for the stage that fetches the
      # root certificates, which runs one package install
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        id: push
        env:
          # The build record is an artifact nobody reads, and one more thing the publish
          # job's download could trip over
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Attested by its digest, as the archives are in publish, and the statement pushed to
      # the registry beside the image: gh attestation verify oci://<image>:<tag> --repo …
      - name: Attest
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record is for a repository an organization owns
          create-storage-record: false

  publish:
    # Waits for the image so the notes can say whether there is one, but needs only the
    # binaries: an image that failed to push must not cost the Release. Nor is anything
    # published whose macOS signature failed its check (skipped: signing not set up).
    needs: [build, image, verify-macos]
    runs-on: ubuntu-latest
    # A tag moved by force fires this workflow again; created is true only for a tag
    # that is new, which is the only case worth publishing.
    if: ${{ !cancelled() && github.event.created && needs.build.result == 'success' && (needs.verify-macos.result == 'success' || needs.verify-macos.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          # Only the build matrix's artifacts: without a pattern this fetches every
          # artifact of the run, and one failed download blocks the release
          pattern: asq-*
          path: dist
          merge-multiple: true

      # The tag's annotation is the release notes. Tag with --cleanup=verbatim, or git
      # strips Markdown headings as comment lines.
      - name: Release notes
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "$GITHUB_REF_NAME" > release-notes.md
          fi
          {
            echo
            echo "Install this release — the script fetches the archive for the machine and checks it against \`SHA256SUMS\`:"
            echo
            echo '```sh'
            echo "curl -fsSL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | VERSION=${GITHUB_REF_NAME} sh"
            echo '```'
            echo
            echo "On Windows, run \`install.ps1\` from below with \`\$env:VERSION = '${GITHUB_REF_NAME}'\`. With Go: \`go install ${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}/cmd/asq@${GITHUB_REF_NAME}\`."
            echo
            echo "Each archive and installer has a build attestation, which says the workflow run and commit that built it: \`gh attestation verify asq-linux-amd64.tar.gz --repo ${GITHUB_REPOSITORY}\`."
            # Only when the image job pushed one: the notes do not advertise what is not there
            if [ "${{ needs.image.result }}" = success ]; then
              echo
              echo "Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\` (linux/amd64, linux/arm64), attested the same way: \`gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v} --repo ${GITHUB_REPOSITORY}\`."
            fi
          } >> release-notes.md

      # The installers download and run; the published digests are what lets them check
      # what they got. Names are relative to dist/, where the archives sit.
      - name: Checksums
        run: |
          cd dist
          sha256sum asq-*.tar.gz asq-*.zip > SHA256SUMS

      # The installers travel with the release they were written for: the copy on the
      # main branch may one day expect archives this release does not have
      - name: Installers
        run: cp install.sh install.ps1 dist/

      # SHA256SUMS comes from the same release as the archives: it catches a download that
      # went wrong, not a release replaced whole. A build attestation does — a statement of
      # the workflow, the commit and the run that made each file, signed through Sigstore
      # with this run's identity and kept by GitHub: gh attestation verify <file> --repo ….
      # Before the release is created, so that nothing is published without one.
      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/asq-*.tar.gz
            dist/asq-*.zip
            dist/install.sh
            dist/install.ps1

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/asq-*.tar.gz dist/asq-*.zip dist/SHA256SUMS dist/install.sh dist/install.ps1
