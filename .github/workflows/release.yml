# 打 tag（v*）自动交叉编译四个平台，产物挂到 GitHub Release。
# 本仓库唯一的依赖是纯 Go 的 SQLite 驱动，CGO 关掉后交叉编译无需任何 C 工具链。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 测试只能跑在原生平台（交叉目标的测试二进制没法执行），所以单独一步、不带 GOOS/GOARCH
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test .

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags '-s -w' -o agent-session-query .
          tar czf "agent-session-query-${GOOS}-${GOARCH}.tar.gz" agent-session-query

      - uses: softprops/action-gh-release@v2
        with:
          files: agent-session-query-*.tar.gz
