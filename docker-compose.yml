# The compose file is for the case the one-line docker run in docs/deploy.md cannot hold:
# mounting every source directory, reading sessions that live outside the default home
# (mount the directory and add --path to command below), or building locally.
services:
  agent-session-query:
    # Published on every release tag, linux/amd64 + linux/arm64. Pin a version instead of
    # latest if you want upgrades to be deliberate.
    image: ghcr.io/itswl/agent-session-query:latest
    # To build locally instead — your own change, or a registry mirror — replace the image
    # line with this block. The base image can be swapped, for example
    #   GO_IMAGE=swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/golang:1.24-alpine
    # build:
    #   context: .
    #   args:
    #     GO_IMAGE: ${GO_IMAGE:-golang:1.24-alpine}
    container_name: agent-session-query
    ports:
      # Published to host loopback only: this service can read complete session content, so
      # do not expose it to the whole local network by default.
      # To share it, change this to "8080:8080" — and set HOOK_TOKEN.
      - "127.0.0.1:8080:8080"
    volumes:
      # Mount whichever source directories the host has; a source with nothing mounted is
      # skipped. Inside the container HOME is /root, so a directory mounts to the same place
      # under /root/...
      # Note: a directory that does not exist on the host is created by Docker as an empty
      # one owned by root.
      # Mount the whole of ~/.hermes: newer sessions live entirely in state.db (its -wal/-shm
      # companions have to come along, and mounting just sessions/ reads nothing). That
      # directory also holds Hermes config and credentials — keep the mount read-only and
      # keep the service off the public internet.
      - ~/.hermes:/root/.hermes:ro
      # 2026.9 OpenClaw keeps its SQLite databases under agents/<id>/agent/; older installs
      # keep sessions.json under agents/default/sessions/. Mount agents/ whole: both
      # layouts are covered, and an empty one is harmless.
      - ~/.openclaw/agents:/root/.openclaw/agents:ro
      - ~/.pi/agent/sessions:/root/.pi/agent/sessions:ro
      - ~/.claude/projects:/root/.claude/projects:ro
      - ~/.codex/sessions:/root/.codex/sessions:ro
      - ~/.gemini/tmp:/root/.gemini/tmp:ro
      - ~/.grok/sessions:/root/.grok/sessions:ro
      # opencode keeps one database in its XDG data directory (~/.local/share/opencode on
      # every Unix-like, macOS included)
      - ~/.local/share/opencode:/root/.local/share/opencode:ro
      # Sessions outside the default home: mount the directory anywhere and name it with
      # --path in command below, e.g.
      #   - /srv/agents/box2/.claude/projects:/mnt/box2:ro
      # together with "--path" and "claude:box2=/mnt/box2" appended to command
    # The token travels in the environment, not on the command line — arguments show up in
    # ps. (docker inspect can read a container's environment too, but anyone who can run
    # docker can already read the mounted sessions; the rule is about argv and process
    # listings, not about the daemon.)
    environment:
      HOOK_TOKEN: "${HOOK_TOKEN:-}"
    # The remaining arguments pass straight through; inside a container it has to bind
    # 0.0.0.0 or the port mapping cannot reach it. A non-loopback bind without a token
    # refuses to start, so `docker compose up` without HOOK_TOKEN now fails fast with that
    # message instead of serving the mounted sessions to the network.
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--mode"
      - "${SESSION_MODE:-auto}"
    # The process runs as root on purpose (docs/deploy.md says why): the mounted
    # transcripts are 0600, so a fixed non-root uid baked into the image would read
    # nothing. To run it as yourself anyway, set the ids explicitly — compose does not
    # expand $(id -u):
    #   user: "1000:1000"
    restart: unless-stopped
