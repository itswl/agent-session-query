# Pushing a v* tag cross-compiles six platforms and attaches the artifacts to a GitHub
# Release. The only dependency is a pure-Go SQLite driver, so with CGO off cross-compilation
# needs no C toolchain at all.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Tests have to run on real machines: a cross-compiled test binary cannot execute on
  # another platform. Shipping a Windows artifact means a Windows runner has to verify it,
  # or the release is going out blind.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          binary="agent-session-query${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/itswl/agent-session-query/internal/app.buildVersion=${GITHUB_REF_NAME}" \
            -o "$binary" ./cmd/agent-session-query
          # Unpacking tar.gz on Windows is awkward, so ship a zip there
          if [ "$GOOS" = windows ]; then
            zip -q "agent-session-query-$GOOS-$GOARCH.zip" "$binary"
          else
            tar czf "agent-session-query-$GOOS-$GOARCH.tar.gz" "$binary"
          fi

      # action-gh-release does not pick up the tag annotation as release notes on its own
      # (no body means an empty body), so read it out explicitly. Remember --cleanup=verbatim
      # when tagging, or git strips Markdown ## headings as comment lines.
      - name: Use the tag annotation as release notes
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "$GITHUB_REF_NAME" > release-notes.md
          fi

      # Publish with gh itself. action-gh-release was leaving a duplicate draft release
      # behind on every publish (two release objects, same second, one run — seen on
      # v0.6.0 and v0.7.0); gh release create makes exactly one or fails loudly.
      # A forced tag update (retagging to fix a note) would fire this workflow again;
      # github.event.created is true only for a newly created tag, which is the only
      # case worth publishing.
      # Runs once per build job (each contributes its own platform's artifact), so:
      # nullglob — this job produces either .tar.gz or .zip, never both, and a
      #   non-matching glob must expand to nothing rather than fail the shell;
      # view-then-create-or-upload — six jobs race to publish one release; the first
      #   creates it, the rest upload their artifacts onto it.
      - if: ${{ github.event.created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(agent-session-query-*.tar.gz agent-session-query-*.zip)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${files[@]}" || \
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          fi
