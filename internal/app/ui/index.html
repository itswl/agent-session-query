<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <!-- viewport-fit=cover so the page can reach under a notch and the home indicator; the
       stylesheet then pads by the safe-area insets. Without it those areas stay blank in
       standalone mode and the layout sits in a letterbox. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Installed as a web app: the manifest is what Android and desktop Chrome read, the
       apple-* tags are what iOS reads. -->
  <link rel="manifest" href="/ui/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/ui/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sessions">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="description" content="Browse the sessions left behind by the agent CLIs on this machine: the conversation, the tool calls and the final result of each one.">
<title>Agent sessions</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="stylesheet" href="/ui/style.css">
<!-- Applies a theme you chose before the first paint; the CSP allows no inline script -->
<script src="/ui/theme.js"></script>
</head>
<body>

<div id="gate" class="gate hidden">
  <form id="gate-form" autocomplete="off">
    <svg class="logo mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect class="mark-bg" width="24" height="24" rx="6"/><rect class="mark-bar" x="5" y="6.6" width="14" height="2.6" rx="1.3"/><rect class="mark-bar" x="5" y="10.7" width="10.2" height="2.6" rx="1.3"/><rect class="mark-bar" x="5" y="14.8" width="6.6" height="2.6" rx="1.3"/></svg>
    <h1>Agent sessions</h1>
    <p>Paste your <code>hook_token</code> to continue. It stays in this browser and is never sent anywhere else.</p>
    <input id="gate-token" type="password" placeholder="hook_token" autocomplete="current-password">
    <button type="submit" class="primary">Enter</button>
    <p id="gate-error" class="error"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect class="mark-bg" width="24" height="24" rx="6"/><rect class="mark-bar" x="5" y="6.6" width="14" height="2.6" rx="1.3"/><rect class="mark-bar" x="5" y="10.7" width="10.2" height="2.6" rx="1.3"/><rect class="mark-bar" x="5" y="14.8" width="6.6" height="2.6" rx="1.3"/></svg><h1>Agent sessions</h1></div>
    <!-- Search and list filters. On a wide screen these sit in the header like any
         other control (display: contents keeps the layout identical); on a phone they
         belong to the Sessions pane, and are hidden with the other panes, since none of
         them do anything to a conversation or a details pane. -->
    <div id="controls">
      <input id="search" type="search" placeholder="Search sessions, paths and message bodies">
      <select id="source-filter" aria-label="Filter by source"><option value="">All sources</option></select>
      <select id="grouping" aria-label="Group the list">
        <option value="time">By time</option>
        <option value="project">By project</option>
      </select>
      <label class="auto"><input type="checkbox" id="auto" checked> Auto-refresh</label>
      <span id="status" class="status"></span>
    </div>
    <button id="refresh" class="ghost" title="Refresh (r)">Refresh</button>
    <button id="theme" class="ghost icon-btn" title="Switch theme" aria-label="Switch between light and dark"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor" stroke="none"/></svg></button>
    <button id="logout" class="ghost">Change token</button>
  </header>

  <!-- Phones get one pane at a time; this picks which. Hidden from 861px up, where all
       three fit side by side and a switcher would only take space. -->
  <nav class="panes" id="panes" aria-label="Pane">
    <button type="button" data-pane="list">Sessions</button>
    <button type="button" data-pane="stream">Conversation</button>
    <button type="button" data-pane="side">Details</button>
  </nav>

  <main>
    <!-- Each side pane has a bar of its own: its name, and the controls that act on it. The
         fold toggle is on the pane it folds, at the edge it folds towards; folded, the pane
         keeps a rail with the toggle pointing back. -->
    <aside class="list-pane" aria-label="Sessions">
      <div class="pane-bar">
        <span class="pane-title">Sessions</span>
        <button id="fold-groups" class="ghost tiny" title="Collapse every project">Collapse all</button>
        <button id="toggle-list" class="ghost icon-btn pane-toggle" title="Hide the session list" aria-label="Toggle the session list"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
      </div>
      <div id="list" class="list" role="listbox" aria-label="Session list" tabindex="0"></div>
    </aside>

    <section class="stream">
      <div id="stream-head" class="stream-head"></div>
      <div id="messages" class="messages" tabindex="0">
        <p class="empty">Pick a session to read it</p>
      </div>
    </section>

    <aside class="side-pane" aria-label="Session overview">
      <div class="pane-bar">
        <button id="toggle-side" class="ghost icon-btn pane-toggle" title="Hide the details pane" aria-label="Toggle the details pane"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
        <span class="pane-title">Details</span>
      </div>
      <div id="side" class="side"></div>
    </aside>
  </main>

  <footer id="keyhint" class="keyhint">
    <span><kbd>j</kbd><kbd>k</kbd> move between sessions</span>
    <span><kbd>/</kbd> focus search</span>
    <span><kbd>g</kbd><kbd>G</kbd> jump to start/end</span>
    <span><kbd>r</kbd> refresh</span>
    <span><kbd>Enter</kbd> search message bodies</span>
    <span><kbd>Esc</kbd> clear / leave search</span>
  </footer>
</div>

<script src="/ui/app.js"></script>
</body>
</html>
