# Pushing a v* tag cross-compiles six platforms, publishes a container image built from
# the same binaries, and attaches everything to a GitHub Release. The only dependency
# is a pure-Go SQLite driver, so with cgo off cross-compilation needs no C toolchain.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Tests have to run on real machines: a cross-compiled test binary cannot execute on
  # another platform, and shipping a Windows artifact nothing ran on Windows is shipping
  # it blind.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          binary="asq${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X github.com/itswl/agent-session-query/internal/app.Version=${GITHUB_REF_NAME}" -o "$binary" ./cmd/asq
          # Unpacking a tar.gz on Windows is awkward, so it gets a zip
          if [ "$GOOS" = windows ]; then
            zip -q "asq-$GOOS-$GOARCH.zip" "$binary"
          else
            tar czf "asq-$GOOS-$GOARCH.tar.gz" "$binary"
          fi
          # The container image is these same bytes, not a second compile: the linux
          # builds also hand over the bare binary for the image job to copy in
          if [ "$GOOS" = linux ]; then
            mkdir -p "image/$GOOS/$GOARCH"
            cp "$binary" "image/$GOOS/$GOARCH/asq"
          fi

      # Each job uploads its own archive and one job publishes them all. Publishing from
      # every build job is six of them racing to create one release, and creating a
      # release is not atomic: two jobs that both see none each make one.
      - uses: actions/upload-artifact@v7
        with:
          name: asq-${{ matrix.goos }}-${{ matrix.goarch }}
          path: asq-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

      # Named outside asq-*: the publish job downloads by that pattern and must not see these
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.goos }}-${{ matrix.goarch }}
          path: image/
          if-no-files-found: error

  image:
    # The linux binaries the build matrix just produced, copied into an empty image by
    # Dockerfile.release: no compiler in this job, and byte-identical to the archives.
    needs: build
    if: ${{ github.event.created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: image-linux-*
          path: dist-image
          merge-multiple: true

      # Multi-platform needs buildx; emulation is only for the stage that fetches the
      # root certificates, which runs one package install
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        env:
          # The build record is an artifact nobody reads, and one more thing the publish
          # job's download could trip over
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    # Waits for the image so the notes can say whether there is one, but needs only the
    # binaries: an image that failed to push must not cost the Release.
    needs: [build, image]
    runs-on: ubuntu-latest
    # A tag moved by force fires this workflow again; created is true only for a tag
    # that is new, which is the only case worth publishing.
    if: ${{ !cancelled() && github.event.created && needs.build.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          # Only the build matrix's artifacts: without a pattern this fetches every
          # artifact of the run, and one failed download blocks the release
          pattern: asq-*
          path: dist
          merge-multiple: true

      # The tag's annotation is the release notes. Tag with --cleanup=verbatim, or git
      # strips Markdown headings as comment lines.
      - name: Release notes
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "$GITHUB_REF_NAME" > release-notes.md
          fi
          {
            echo
            echo "Install this release — the script fetches the archive for the machine and checks it against \`SHA256SUMS\`:"
            echo
            echo '```sh'
            echo "curl -fsSL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | VERSION=${GITHUB_REF_NAME} sh"
            echo '```'
            echo
            echo "On Windows, run \`install.ps1\` from below with \`\$env:VERSION = '${GITHUB_REF_NAME}'\`. With Go: \`go install ${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}/cmd/asq@${GITHUB_REF_NAME}\`."
            # Only when the image job pushed one: the notes do not advertise what is not there
            if [ "${{ needs.image.result }}" = success ]; then
              echo
              echo "Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\` (linux/amd64, linux/arm64)."
            fi
          } >> release-notes.md

      # The installers download and run; the published digests are what lets them check
      # what they got. Names are relative to dist/, where the archives sit.
      - name: Checksums
        run: |
          cd dist
          sha256sum asq-*.tar.gz asq-*.zip > SHA256SUMS

      # The installers travel with the release they were written for: the copy on the
      # main branch may one day expect archives this release does not have
      - name: Installers
        run: cp install.sh install.ps1 dist/

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/asq-*.tar.gz dist/asq-*.zip dist/SHA256SUMS dist/install.sh dist/install.ps1
