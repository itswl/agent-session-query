# Pushing a v* tag cross-compiles six platforms and attaches the artifacts to a GitHub
# Release. The only dependency is a pure-Go SQLite driver, so with CGO off cross-compilation
# needs no C toolchain at all.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Tests have to run on real machines: a cross-compiled test binary cannot execute on
  # another platform. Shipping a Windows artifact means a Windows runner has to verify it,
  # or the release is going out blind.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          binary="agent-session-query${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/itswl/agent-session-query/internal/app.buildVersion=${GITHUB_REF_NAME}" \
            -o "$binary" ./cmd/agent-session-query
          # Unpacking tar.gz on Windows is awkward, so ship a zip there
          if [ "$GOOS" = windows ]; then
            zip -q "agent-session-query-$GOOS-$GOARCH.zip" "$binary"
          else
            tar czf "agent-session-query-$GOOS-$GOARCH.tar.gz" "$binary"
          fi
          # The container image is these same bytes, not a second compile: the linux builds
          # also hand over the raw binary plus the liveness probe (scratch has no shell, so
          # the probe is a binary too) for the image job to copy in
          if [ "$GOOS" = linux ]; then
            mkdir -p "image/$GOOS/$GOARCH"
            cp "$binary" "image/$GOOS/$GOARCH/agent-session-query"
            go build -trimpath -ldflags "-s -w" -o "image/$GOOS/$GOARCH/healthcheck" ./cmd/healthcheck
          fi
      # Each job uploads its own archive; a single publish job collects them all below.
      # Publishing from every build job meant six of them racing to create one release,
      # and gh release create is not atomic: on v0.10.1 two jobs passed the "does it
      # exist" check in the same second and two releases appeared, each holding part of
      # the artifacts. One publisher removes the race rather than narrowing it.
      - uses: actions/upload-artifact@v4
        with:
          name: agent-session-query-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent-session-query-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

      # Named outside agent-session-query-*: the publish job downloads by that pattern and
      # must not see these
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.goos }}-${{ matrix.goarch }}
          path: image/
          if-no-files-found: error

  image:
    # The image is the linux binaries the build matrix just produced, copied into scratch
    # by Dockerfile.release: no compiler in this job, and byte-identical to the released
    # archives. Dockerfile (from source) stays for local builds.
    needs: build
    if: ${{ github.event.created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: image-linux-*
          path: dist-image
          merge-multiple: true

      # Multi-platform needs buildx. QEMU does not come into it: nothing runs during this
      # build, it is COPY and metadata only.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        env:
          # The build record is an artifact nobody reads here, and an extra artifact is one
          # more thing the publish job's download could trip over
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [build, image]
    runs-on: ubuntu-latest
    # A forced tag update (retagging to fix a note) fires this workflow again;
    # github.event.created is true only for a newly created tag, which is the only case
    # worth publishing.
    if: ${{ github.event.created }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          # Only the build matrix's artifacts. Without a pattern this fetched every artifact of
          # the run — including the image job's build record — and one failed download of
          # that blocked the whole release (v0.15.0, first run of the image job).
          pattern: agent-session-query-*
          path: dist
          merge-multiple: true

      # action-gh-release does not pick up the tag annotation as release notes on its own
      # (no body means an empty body), so read it out explicitly. Remember --cleanup=verbatim
      # when tagging, or git strips Markdown ## headings as comment lines.
      - name: Use the tag annotation as release notes
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "$GITHUB_REF_NAME" > release-notes.md
          fi
          version="${GITHUB_REF_NAME#v}"
          {
            echo
            echo "Container image: ghcr.io/${GITHUB_REPOSITORY}:$version (linux/amd64 + linux/arm64)."
          } >> release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/agent-session-query-*.tar.gz dist/agent-session-query-*.zip
