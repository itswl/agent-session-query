# Runs on every push and pull request: tests, the format, vet and cross-compile checks,
# and both container images built and run. The release workflow only fires on a tag, and
# release day is the wrong day to find out.
#
# Which platforms depends on where the push lands. A push to any other branch tests on
# Linux only; a pull request and a push to main test on all three. The macOS runner is
# billed at ten Linux minutes a minute and the Windows one at two, and the three-platform
# answer still arrives before anything merges, which is the moment it is read.
name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The race detector needs cgo and a C compiler. Both are ready on the Linux and
      # macOS runners; the Windows runner's toolchain is not always on PATH, so a plain
      # run is enough there.
      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            CGO_ENABLED=0 go test ./...
          else
            go test -race ./...
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # The page is hand-written with no build step, so nothing compiles it: a syntax
      # error would ship with every Go test green. This is the parse they cannot do.
      - name: JavaScript syntax
        run: |
          find web -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Installer syntax
        run: sh -n install.sh

      # The formula and the manifest Homebrew and Scoop read from this repository: what the
      # script release.yml writes them with writes for the release they name
      - name: Formula and manifest
        run: |
          python3 scripts/package_managers.py --check
          ruby -c Formula/asq.rb

      - name: go vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      # All six released platforms must build, platform-specific files included
      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "  $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || exit 1
          done

  # The two images. Nothing else builds them before a tag does, and the published one is
  # put together there from files only that workflow has: a COPY that finds nothing, or
  # an ignore file that hides what it needs, would first show on release day. So the
  # release image is assembled here the way release.yml assembles it, and then run.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Release image
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist-image/linux/amd64
          go build -trimpath -ldflags "-s -w -X github.com/itswl/agent-session-query/internal/app.Version=ci" -o dist-image/linux/amd64/asq ./cmd/asq
          docker build -f Dockerfile.release -t asq:release .
          docker run --rm asq:release --version

      - name: Image from source
        run: |
          docker build --build-arg VERSION=ci -t asq:source .
          docker run --rm asq:source --version

      # What the image is for: it refuses to serve without a token, serves with one, and
      # answers the health check it declares
      - name: Run it
        run: |
          set +e
          timeout 30 docker run --rm asq:release
          status=$?
          set -e
          if [ "$status" = 0 ] || [ "$status" = 124 ]; then
            echo "the image served without a token (exit $status)"
            exit 1
          fi
          docker run -d --name asq -e ASQ_TOKEN=0123456789abcdef0123456789abcdef asq:release
          for attempt in $(seq 1 40); do
            docker exec asq /asq ping > /dev/null 2>&1 && break
            sleep 0.5
          done
          docker exec asq /asq ping
