# 打 tag（v*）自动交叉编译六个平台，产物挂到 GitHub Release。
# 本仓库唯一的依赖是纯 Go 的 SQLite 驱动，CGO 关掉后交叉编译无需任何 C 工具链。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 测试必须跑在真机上：交叉编译出来的测试二进制没法在别的平台执行。
  # 发 Windows 产物就得有 Windows runner 把它验一遍，否则等于盲发。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          binary="agent-session-query${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/itswl/agent-session-query/internal/app.buildVersion=${GITHUB_REF_NAME}" \
            -o "$binary" ./cmd/agent-session-query
          # Windows 上解 tar.gz 不顺手，产物打成 zip
          if [ "$GOOS" = windows ]; then
            zip -q "agent-session-query-$GOOS-$GOARCH.zip" "$binary"
          else
            tar czf "agent-session-query-$GOOS-$GOARCH.tar.gz" "$binary"
          fi

      # action-gh-release 不会自动拿 tag 的注释当发布说明（不给 body 就是空正文），
      # 显式取出来。打 tag 时记得带 --cleanup=verbatim，否则 Markdown 的 ## 标题
      # 会被 git 当成注释行剥掉。
      - name: 取 tag 注释当发布说明
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "$GITHUB_REF_NAME" > release-notes.md
          fi

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            agent-session-query-*.tar.gz
            agent-session-query-*.zip
